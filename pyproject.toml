[project]
name = "cod-voice-agent"
version = "0.1.0"
description = "Real-time voice agent that confirms cash-on-delivery orders (Pipecat, LiveKit, Whisper, Kokoro, Claude, PostgreSQL)"
authors = [
    { name = "Amine Benzaazaa", email = "61782040+AmineBenzaazaa@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pipecat-ai-prebuilt>=1.3.0",
    "pipecat-ai[anthropic,kokoro,livekit,mlx-whisper,silero,webrtc,whisper]>=1.15.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false
