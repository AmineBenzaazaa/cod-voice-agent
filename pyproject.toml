[project]
name = "cod-voice-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Amine Benzaazaa", email = "61782040+AmineBenzaazaa@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pipecat-ai-prebuilt>=1.3.0",
    "pipecat-ai[anthropic,kokoro,livekit,mlx-whisper,silero,webrtc,whisper]>=1.15.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
cod-voice-agent = "cod_voice_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
